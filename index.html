<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Conjunto Residencial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- Encabezado / Logo -->
        <div class="login-header">
            <div class="logo-icon">??</div>
            <h2>Mi Conjunto</h2>
            <p>Gestión Residencial Inteligente</p>
        </div>

        <!-- Formulario de Acceso -->
        <form id="login-form">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label for="role">Tipo de Usuario</label>
                <select id="role" required>
                    <option value="" disabled selected>Selecciona tu rol...</option>
                    <option value="residente">?? Residente</option>
                    <option value="porteria">??? Portería / Seguridad</option>
                    <option value="administrador">?? Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Ingresar al Sistema</button>
        </form>

        <div class="login-footer">
            <p>¿Problemas con tu acceso? Contacta a administración.</p>
        </div>
    </div>
</body>
</html>
